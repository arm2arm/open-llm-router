name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: olr
          POSTGRES_DB: olr_test
          POSTGRES_PASSWORD: olr-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U olr -d olr_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      OLR_TEST_DATABASE_URL: postgres://olr:olr-ci-only@127.0.0.1:5432/olr_test?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Format, vet and staticcheck
        run: make lint
      - name: Vulnerability check
        run: make vuln
      - name: Unit and integration tests (race detector)
        run: make test
      - name: SSE splitter fuzz test
        run: go test ./internal/usage -run '^$' -fuzz '^FuzzStreamPreservesBytes$' -fuzztime=10s -parallel=2
      - name: Client verification helpers
        run: make test-clients

  images:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Portal lint, type check, build and dependency audit
        run: make web-check
      - name: Install browser test runtime
        run: cd web && npx playwright install --with-deps chromium
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Validate production pilot Compose with synthetic site values
        run: python3 tests/pilot/check_compose.py
      - name: Render the Kubernetes manifests
        run: kubectl kustomize deploy/k8s/base > /dev/null && kubectl kustomize deploy/k8s/test > /dev/null
      - name: Validate the observability stack and the generated dashboard
        run: |
          docker compose -f deploy/compose/docker-compose.yml -f deploy/compose/observability.yml config --quiet
          python3 deploy/observability/tools/dashboard.py | diff - deploy/observability/grafana/dashboards/open-llm-router.json
      - name: Verify trusted-edge authentication throttling
        run: python3 tests/security/check_edge.py
      - name: Prepare explicitly approved synthetic content-capture fixture
        run: |
          python3 - <<'PYCONFIG'
          import os, pathlib
          source = pathlib.Path("config.example.yaml").read_text()
          marker = "content_tracing:\n  enabled: false"
          assert marker in source
          path = pathlib.Path(os.environ["RUNNER_TEMP"]) / "trace-fixture.yaml"
          path.write_text(source.replace(marker, "content_tracing:\n  enabled: true", 1))
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"OLR_CONFIG_FILE={path}\n")
          PYCONFIG
      - name: Build images and start the stack
        run: make up
      - name: Probe router and both mock backends
        run: make smoke
      - name: Portal self-service browser journey
        run: cd web && npm run test:e2e
      - name: Keycloak login, portal API and SSO logout
        run: make portal-check
      - name: Brokered login and required claim
        run: make brokered-check
      - name: Official OpenAI and Anthropic SDKs against router and mocks
        run: |
          python3 -m venv /tmp/olr-sdk
          /tmp/olr-sdk/bin/pip install 'openai==3.49.0' 'anthropic==2.8.0'
          make sdk SDK_RUN=/tmp/olr-sdk/bin/python
          make sdk-limits SDK_RUN=/tmp/olr-sdk/bin/python
      - name: 256-stream load, disconnect, accounting and leak checks
        run: make loadtest LOADTEST_ARGS='-requests 256 -tokens 32 -settle 250ms -check-performance=false' > loadtest.json
      - name: Preserve load-test measurements
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: loadtest
          path: loadtest.json
          if-no-files-found: ignore
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop the stack
        if: always()
        run: docker compose down --volumes

  helm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@bf6a7d304bc2fdb57e0331155b7ebf2c504acf0a # v4
        with:
          version: v4.3.1
      - uses: helm/kind-action@0b5c88445f37b7e12a2ce1ecca7805b9046a74db # v1
        with:
          version: v0.33.0
          kubectl_version: v1.37.0
          install_only: true
      - name: Validate chart rendering, schema, security and package
        run: |
          python3 -m venv /tmp/olr-helm
          /tmp/olr-helm/bin/pip install PyYAML==6.0.3
          /tmp/olr-helm/bin/python tests/helm/check_chart.py
      - name: Install, upgrade and roll back in disposable Kubernetes
        run: bash tests/helm/acceptance.sh

  network-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@bf6a7d304bc2fdb57e0331155b7ebf2c504acf0a # v4
        with:
          version: v4.3.1
      - uses: helm/kind-action@0b5c88445f37b7e12a2ce1ecca7805b9046a74db # v1
        with:
          version: v0.33.0
          kubectl_version: v1.37.0
          install_only: true
      - name: Prove allowed traffic and denied lateral access with Calico
        run: |
          python3 -m venv /tmp/olr-policy
          /tmp/olr-policy/bin/pip install PyYAML==6.0.3
          PYTHON=/tmp/olr-policy/bin/python bash tests/security/network_policy.sh

  release-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test fail-closed image signature and attestation deployment gate
        run: |
          python3 -m venv /tmp/olr-release
          /tmp/olr-release/bin/pip install PyYAML==6.0.3
          /tmp/olr-release/bin/python tests/security/check_release.py
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Scan repository for provider and generic secrets
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          gitleaks dir --redact --no-banner
