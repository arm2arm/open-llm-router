name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: olr
          POSTGRES_DB: olr_test
          POSTGRES_PASSWORD: olr-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U olr -d olr_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      OLR_TEST_DATABASE_URL: postgres://olr:olr-ci-only@127.0.0.1:5432/olr_test?sslmode=disable
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Format, vet and staticcheck
        run: make lint
      - name: Vulnerability check
        run: make vuln
      - name: Unit and integration tests (race detector)
        run: make test
      - name: Client verification helpers
        run: make test-clients

  images:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build images and start the stack
        run: make up
      - name: Probe router and both mock backends
        run: make smoke
      - name: Official OpenAI and Anthropic SDKs against router and mocks
        run: |
          python3 -m venv /tmp/olr-sdk
          /tmp/olr-sdk/bin/pip install 'openai==3.49.0' 'anthropic==2.8.0'
          make sdk SDK_RUN=/tmp/olr-sdk/bin/python
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
