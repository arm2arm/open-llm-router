name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-mutations:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: olr
          POSTGRES_DB: olr_test
          POSTGRES_PASSWORD: olr-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U olr -d olr_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      OLR_TEST_DATABASE_URL: postgres://olr:olr-ci-only@127.0.0.1:5432/olr_test?sslmode=disable
      OLR_REQUIRE_DATABASE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Require assertions to kill each security mutation
        run: python3 tests/security/check_mutations.py

  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: olr
          POSTGRES_DB: olr_test
          POSTGRES_PASSWORD: olr-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U olr -d olr_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      OLR_TEST_DATABASE_URL: postgres://olr:olr-ci-only@127.0.0.1:5432/olr_test?sslmode=disable
      OLR_REQUIRE_DATABASE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Format, vet and staticcheck
        run: make lint
      - name: Verify documented PostgreSQL backup and restore
        env:
          OLR_DOCS_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: python3 tests/security/check_libpq_url.py
      - name: Vulnerability check
        run: make vuln
      - name: Install the administration MCP interoperability client
        run: |
          python3 -m venv /tmp/olr-mcp
          /tmp/olr-mcp/bin/pip install 'mcp==1.30.0'
          python3 -m venv /tmp/olr-mcp2
          /tmp/olr-mcp2/bin/pip install 'mcp==2.0.0'
      - name: Unit and integration tests (race detector)
        env:
          OLR_TEST_MCP_PYTHON: /tmp/olr-mcp2/bin/python
        run: make test
      - name: MCP 1.x compatibility
        env:
          OLR_TEST_MCP_PYTHON: /tmp/olr-mcp/bin/python
        run: go test -count=1 ./tests/integration -run '^TestAgentAdministrationLifecycle$'
      - name: SSE splitter and usage timing fuzz tests
        run: |
          go test ./internal/usage -run '^$' -fuzz '^FuzzStreamPreservesBytes$' -fuzztime=10s -parallel=2
          go test ./internal/proxy -run '^$' -fuzz '^FuzzRequestModelExtraction$' -fuzztime=20s -parallel=2
          go test ./internal/usage -run '^$' -fuzz '^FuzzTimingPreservesProviderBytes$' -fuzztime=10s -parallel=2
      - name: Client verification helpers
        run: make test-clients

  images:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Portal lint, type check, build and dependency audit
        run: |
          make web-check
          node --test web/scripts/licenses.test.mjs
      - name: Install browser test runtime
        run: cd web && npx playwright install --with-deps chromium
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Validate production pilot Compose with synthetic site values
        run: python3 tests/pilot/check_compose.py
      - name: Render the Kubernetes manifests
        run: kubectl kustomize deploy/k8s/base > /dev/null && kubectl kustomize deploy/k8s/test > /dev/null
      - name: Validate the observability stack and the generated dashboard
        run: |
          docker compose -f deploy/compose/docker-compose.yml -f deploy/compose/observability.yml config --quiet
          python3 deploy/observability/tools/dashboard.py | diff - deploy/observability/grafana/dashboards/open-llm-router.json
      - name: Verify trusted-edge authentication throttling
        run: python3 tests/security/check_edge.py
      - name: Prepare explicitly approved synthetic content-capture fixture
        run: |
          python3 - <<'PYCONFIG'
          import os, pathlib
          source = pathlib.Path("config.example.yaml").read_text()
          marker = "content_tracing:\n  enabled: false"
          assert marker in source
          path = pathlib.Path(os.environ["RUNNER_TEMP"]) / "trace-fixture.yaml"
          path.write_text(source.replace(marker, "content_tracing:\n  enabled: true", 1))
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"OLR_CONFIG_FILE={path}\n")
          PYCONFIG
      - name: Build images and start the stack
        run: make up
      - name: Probe router and both mock backends
        run: make smoke
      - name: Use Bash and curl inside the non-root router container
        run: |
          docker compose exec -T router /bin/bash -ec '
            test "$(id -u)" = 65532
            curl --fail --silent --show-error http://127.0.0.1:8080/healthz
            curl --fail --silent --show-error http://127.0.0.1:8080/readyz
          '
      - name: Portal browser journeys, accessibility and reflow
        run: cd web && npm run test:e2e
      - name: Clean install without an identity provider
        run: make acceptance-local
      - name: Keycloak login, portal API and SSO logout
        run: make portal-check
      - name: Brokered login and required claim
        run: make brokered-check
      - name: Official OpenAI and Anthropic SDKs against router and mocks
        run: |
          python3 -m venv /tmp/olr-sdk
          /tmp/olr-sdk/bin/pip install 'openai==3.49.0' 'anthropic==2.8.0'
          make sdk SDK_RUN=/tmp/olr-sdk/bin/python
          make sdk-limits SDK_RUN=/tmp/olr-sdk/bin/python
      - name: 256-stream load, disconnect, accounting and leak checks
        run: make loadtest LOADTEST_ARGS='-requests 256 -tokens 32 -settle 250ms -check-performance=false' > loadtest.json
      - name: Scrape router metrics with a custom token
        run: python3 tests/observability/check_scrape.py
      - name: Preserve load-test measurements
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: loadtest
          path: loadtest.json
          if-no-files-found: ignore
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop the stack
        if: always()
        run: docker compose -f deploy/compose/docker-compose.yml -f deploy/compose/observability.yml down --volumes

  cross-image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Cross-build ARM64 with runtime diagnostic packages
        run: |
          docker buildx build --platform linux/arm64 --target olr \
            --build-arg VERSION=v0.0.0-check --build-arg COMMIT="$GITHUB_SHA" \
            --output type=oci,dest=/tmp/olr-arm64.tar .
          python3 tests/security/check_oci_image.py /tmp/olr-arm64.tar \
            --architecture arm64 --version v0.0.0-check --commit "$GITHUB_SHA"

  helm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v4.3.1
      - uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          version: v0.33.0
          kubectl_version: v1.37.0
          install_only: true
      - name: Validate chart rendering, schema, security and package
        run: |
          python3 -m venv /tmp/olr-helm
          /tmp/olr-helm/bin/pip install PyYAML==6.0.3
          /tmp/olr-helm/bin/python tests/helm/check_chart.py
      - name: Install, upgrade and roll back in disposable Kubernetes
        run: |
          bash tests/helm/settings-key.sh
          bash tests/helm/acceptance.sh

  network-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v4.3.1
      - uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          version: v0.33.0
          kubectl_version: v1.37.0
          install_only: true
      - name: Prove allowed traffic and denied lateral access with Calico
        run: |
          python3 -m venv /tmp/olr-policy
          /tmp/olr-policy/bin/pip install PyYAML==6.0.3
          PYTHON=/tmp/olr-policy/bin/python bash tests/security/network_policy.sh

  release-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v4.3.1
      - name: Test fail-closed image signature and attestation deployment gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m venv /tmp/olr-release
          /tmp/olr-release/bin/pip install PyYAML==6.0.3
          /tmp/olr-release/bin/python tests/security/check_release.py
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Check pinned image and tool update coverage
        run: python3 tests/security/check_pinned_updates.py
      - name: Scan repository for provider and generic secrets
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          gitleaks dir --redact --no-banner
          python3 deploy/release/scan_history.py
          python3 tests/security/check_secret_history.py
