name: Signed release
on:
  workflow_dispatch:
    inputs:
      version:
        description: New immutable release tag (vMAJOR.MINOR.PATCH)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: signed-release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require tested main commit and unused semantic release tag
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          ! git rev-parse --verify "refs/tags/$VERSION" 2>/dev/null
          gh api "repos/$REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=push&status=success" \
            --jq '.workflow_runs | length > 0' | grep -qx true
          echo "IMAGE=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "IDENTITY=https://github.com/$REPOSITORY/.github/workflows/release.yml@refs/heads/main" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: .
          target: olr
          push: true
          tags: ${{ env.IMAGE }}:${{ inputs.version }}
          provenance: mode=max
          sbom: true
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign the immutable image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Sign and publish provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Sign and publish the SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true
      - name: Verify published signatures and both attestations
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          cosign verify --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com "$IMAGE@$DIGEST"
          for predicate in https://slsa.dev/provenance/v1 https://spdx.dev/Document; do
            gh attestation verify "oci://$IMAGE@$DIGEST" --repo "$REPOSITORY" \
              --signer-workflow "$REPOSITORY/.github/workflows/release.yml" \
              --cert-identity "$IDENTITY" --source-ref refs/heads/main \
              --deny-self-hosted-runners --predicate-type "$predicate"
          done
          printf '%s@%s\n' "$IMAGE" "$DIGEST" > image.txt
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Sign release tag and publish verified release
        env:
          GITSIGN_TOKEN_PROVIDER: github-actions
        run: |
          set -euo pipefail
          go install github.com/sigstore/gitsign@v0.18.0
          export PATH="$(go env GOPATH)/bin:$PATH"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config gpg.format x509
          git config gpg.x509.program gitsign
          git tag -s "$VERSION" "$GITHUB_SHA" -m "Release $VERSION"
          gitsign verify-tag --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com "$VERSION"
          gh auth setup-git
          git push origin "refs/tags/$VERSION"
          gh release create "$VERSION" --verify-tag --generate-notes image.txt sbom.spdx.json
