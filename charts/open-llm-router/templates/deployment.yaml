{{- if and (dig "security" "require_tls" false .Values.config) (or .Values.postgresql.enabled .Values.keycloak.enabled .Values.demoBackend.enabled (not .Values.networkPolicy.enabled)) }}
{{- fail "production TLS requires external TLS services and networkPolicy.enabled=true; bundled services are disposable demos only" }}
{{- end }}
{{- range $name, $_ := .Values.env }}
{{- if or (eq $name "OLR_CONFIG") (eq $name "PORTAL_BASE_URL") (eq $name "PORTAL_COOKIE_SECURE") (eq $name "OLR_DEMO_BACKEND_URL") (eq $name "OLR_DATABASE_URL") (and $.Values.keycloak.enabled (hasPrefix "OIDC_" $name)) }}
{{- fail (printf "env.%s is managed by the chart; use the dedicated chart values instead" $name) }}
{{- end }}
{{- end }}
{{- if and .Values.portal.cookieSecure (not (hasPrefix "https://" .Values.portal.baseURL)) }}
{{- fail "portal.cookieSecure=true requires an HTTPS portal.baseURL" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "olr.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "olr.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "olr.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "olr.selectorLabels" . | nindent 8 }}
      annotations:
        {{- $annotations := mergeOverwrite (deepCopy .Values.podAnnotations) (dict "checksum/config" (include "olr.config" . | sha256sum)) }}
        {{- toYaml $annotations | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 35
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if or .Values.postgresql.enabled .Values.keycloak.enabled }}
      initContainers:
        {{- if .Values.postgresql.enabled }}
        - name: wait-for-postgresql
          image: {{ .Values.postgresql.image | quote }}
          command: [sh, -ec]
          args:
            - 'until pg_isready -h "$PGHOST" -U "$PGUSER" -d "$PGDATABASE"; do sleep 2; done'
          env:
            - {name: PGHOST, value: {{ include "olr.componentName" (dict "root" . "component" "postgresql") | quote }}}
            - {name: PGUSER, value: {{ .Values.postgresql.username | quote }}}
            - {name: PGDATABASE, value: {{ .Values.postgresql.database | quote }}}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}
        {{- end }}
        {{- if .Values.keycloak.enabled }}
        - name: wait-for-keycloak
          image: {{ .Values.keycloak.image | quote }}
          command: [/bin/bash, -ec]
          args:
            - |
              until (
                exec 3<>/dev/tcp/"$KEYCLOAK_HOST"/8080
                printf 'GET /realms/olr-demo/.well-known/openid-configuration HTTP/1.0\r\nHost: %s\r\n\r\n' "$KEYCLOAK_HOST" >&3
                read -r response <&3
                [[ "$response" == *" 200 "* ]]
              ); do sleep 2; done
          env:
            - {name: KEYCLOAK_HOST, value: {{ include "olr.componentName" (dict "root" . "component" "keycloak") | quote }}}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}
        {{- end }}
      {{- end }}
      containers:
        - name: router
          image: {{ include "olr.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: [serve]
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - secretRef:
                name: {{ include "olr.secretName" . }}
          env:
            - name: OLR_CONFIG
              value: /etc/olr/config.yaml
            - name: PORTAL_BASE_URL
              value: {{ .Values.portal.baseURL | quote }}
            - name: PORTAL_COOKIE_SECURE
              value: {{ .Values.portal.cookieSecure | quote }}
            {{- if .Values.demoBackend.enabled }}
            - name: OLR_DEMO_BACKEND_URL
              value: {{ printf "http://%s:8000" (include "olr.componentName" (dict "root" . "component" "demo")) | quote }}
            {{- end }}
            {{- if .Values.keycloak.enabled }}
            - name: OIDC_ISSUER
              value: {{ printf "%s/realms/olr-demo" (.Values.keycloak.baseURL | trimSuffix "/") | quote }}
            - name: OIDC_BACKCHANNEL_URL
              value: {{ printf "http://%s:8080/realms/olr-demo" (include "olr.componentName" (dict "root" . "component" "keycloak")) | quote }}
            - name: OIDC_PORTAL_CLIENT_ID
              value: olr-portal
            - name: OIDC_GROUPS_CLAIM
              value: groups
            - name: OIDC_USERNAME_CLAIM
              value: preferred_username
            {{- end }}
            {{- range $name, $value := .Values.env }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/olr
              readOnly: true
            - name: tmp
              mountPath: /tmp
            {{- if .Values.tls.caSecretName }}
            - {name: ca, mountPath: /etc/olr/ca, readOnly: true}
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        {{- if .Values.tls.caSecretName }}
        - name: ca
          secret: {secretName: {{ .Values.tls.caSecretName | quote }}}
        {{- end }}
        - name: config
          configMap:
            name: {{ include "olr.fullname" . | trunc 56 | trimSuffix "-" }}-config
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
