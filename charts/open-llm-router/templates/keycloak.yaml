{{- if .Values.keycloak.enabled }}
{{- $component := dict "root" . "component" "keycloak" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "olr.componentName" $component }}-realm
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "olr.componentSelector" $component | nindent 4 }}
data:
  olr-demo-realm.json: |
    {{- .Files.Get "files/olr-demo-realm.json" | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "olr.componentName" $component }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "olr.componentSelector" $component | nindent 4 }}
spec:
  selector:
    {{- include "olr.componentSelector" $component | nindent 4 }}
  ports:
    - {name: http, port: 8080, targetPort: http}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "olr.componentName" $component }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "olr.componentSelector" $component | nindent 4 }}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels:
      {{- include "olr.componentSelector" $component | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "olr.componentSelector" $component | nindent 8 }}
      annotations:
        checksum/realm: {{ .Files.Get "files/olr-demo-realm.json" | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: keycloak
          image: {{ .Values.keycloak.image | quote }}
          args: [start-dev, --import-realm]
          env:
            - {name: KC_BOOTSTRAP_ADMIN_USERNAME, value: admin}
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "olr.secretName" . }}
                  key: KC_BOOTSTRAP_ADMIN_PASSWORD
            - name: OIDC_PORTAL_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "olr.secretName" . }}
                  key: OIDC_PORTAL_CLIENT_SECRET
            - name: OLR_DEMO_USER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "olr.secretName" . }}
                  key: OLR_DEMO_USER_PASSWORD
            - {name: KC_HOSTNAME, value: {{ .Values.keycloak.baseURL | trimSuffix "/" | quote }}}
            - {name: KC_HOSTNAME_BACKCHANNEL_DYNAMIC, value: "true"}
            - {name: KC_HEALTH_ENABLED, value: "true"}
            - {name: PORTAL_BASE_URL, value: {{ .Values.portal.baseURL | trimSuffix "/" | quote }}}
          ports:
            - {name: http, containerPort: 8080}
            - {name: management, containerPort: 9000}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          startupProbe:
            httpGet: {path: /health/ready, port: management}
            periodSeconds: 3
            failureThreshold: 100
          readinessProbe:
            httpGet: {path: /health/ready, port: management}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health/live, port: management}
            periodSeconds: 10
          resources:
            {{- toYaml .Values.keycloak.resources | nindent 12 }}
          volumeMounts:
            - {name: data, mountPath: /opt/keycloak/data}
            - {name: realm, mountPath: /opt/keycloak/data/import, readOnly: true}
      volumes:
        - name: data
          {{- if .Values.keycloak.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "olr.componentName" $component }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: realm
          configMap:
            name: {{ include "olr.componentName" $component }}-realm
{{- end }}
