{{- if .Values.ingress.enabled }}
{{- $scheme := ternary "https" "http" (not (empty .Values.ingress.tlsSecretName)) }}
{{- if ne (.Values.portal.baseURL | trimSuffix "/") (printf "%s://%s" $scheme .Values.ingress.host) }}
{{- fail "portal.baseURL must match the router ingress origin (https with tlsSecretName, otherwise http), without the internal :8080 port" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "olr.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "olr.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ required "ingress.className is required when ingress is enabled" .Values.ingress.className | quote }}
  {{- with .Values.ingress.tlsSecretName }}
  tls:
    - hosts: [{{ $.Values.ingress.host | quote }}]
      secretName: {{ . | quote }}
  {{- end }}
  rules:
    - host: {{ required "ingress.host is required when ingress is enabled" .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "olr.fullname" . }}
                port:
                  name: http
{{- end }}
