{{- if not .Values.existingSecret }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace (include "olr.secretName" .)).data | default dict }}
{{- $data := deepCopy $existing }}
{{- $_ := set $data "OLR_BOOTSTRAP_ADMIN_PASSWORD" (include "olr.credential" (dict "value" .Values.secrets.bootstrapAdminPassword "existing" $existing "key" "OLR_BOOTSTRAP_ADMIN_PASSWORD")) }}
{{- $_ := set $data "OLR_API_KEY_ENCRYPTION_KEY" (include "olr.credential" (dict "value" .Values.secrets.apiKeyEncryptionKey "existing" $existing "key" "OLR_API_KEY_ENCRYPTION_KEY")) }}
{{- if .Values.postgresql.enabled }}
{{- $password := include "olr.credential" (dict "value" .Values.postgresql.password "existing" $existing "key" "POSTGRES_PASSWORD") }}
{{- if and (hasKey $existing "POSTGRES_PASSWORD") (ne $password (index $existing "POSTGRES_PASSWORD")) }}
{{- fail "postgresql.password cannot change an initialized database password; rotate it in PostgreSQL and the Secret together" }}
{{- end }}
{{- $_ := set $data "POSTGRES_PASSWORD" $password }}
{{- $host := include "olr.componentName" (dict "root" . "component" "postgresql") }}
{{- $url := printf "postgres://%s:%s@%s:5432/%s?sslmode=disable" (.Values.postgresql.username | urlquery | replace "+" "%20") ($password | b64dec | urlquery | replace "+" "%20") $host .Values.postgresql.database }}
{{- $_ := set $data "OLR_DATABASE_URL" ($url | b64enc) }}
{{- else }}
{{- $_ := set $data "OLR_DATABASE_URL" (required "externalDatabase.url or existingSecret is required when postgresql.enabled=false" .Values.externalDatabase.url | b64enc) }}
{{- end }}
{{- if .Values.keycloak.enabled }}
{{- range $key, $value := dict "KC_BOOTSTRAP_ADMIN_PASSWORD" .Values.keycloak.adminPassword "OIDC_PORTAL_CLIENT_SECRET" .Values.keycloak.clientSecret "OLR_DEMO_USER_PASSWORD" .Values.keycloak.demoUserPassword }}
{{- $_ := set $data $key (include "olr.credential" (dict "value" $value "existing" $existing "key" $key)) }}
{{- end }}
{{- end }}
{{- range $key, $value := .Values.secrets.env }}
{{- if or (has $key (list "OLR_DATABASE_URL" "OLR_BOOTSTRAP_ADMIN_PASSWORD" "OLR_API_KEY_ENCRYPTION_KEY" "POSTGRES_PASSWORD")) (and $.Values.keycloak.enabled (has $key (list "KC_BOOTSTRAP_ADMIN_PASSWORD" "OIDC_PORTAL_CLIENT_SECRET" "OLR_DEMO_USER_PASSWORD"))) }}
{{- fail (printf "secrets.env.%s is managed by the chart; use its dedicated credential value instead" $key) }}
{{- end }}
{{- $_ := set $data $key ($value | b64enc) }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "olr.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "olr.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- toYaml $data | nindent 2 }}
{{- end }}
