# The default stack is a disposable demo. TLS and digest enforcement are opt-in.
production: false
# Require immutable digests for every enabled image. Independent of production.
enforceImageDigests: false
# Build the router image from this checkout; no public image is assumed.
image:
  repository: olr-router
  tag: local
  # Prefer a tested digest in production; when set, it takes precedence over tag.
  digest: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# The router's limits, queue and affinity are process-local. Only 1 is supported.
replicaCount: 1

# Empty: create a release-scoped Secret and generate any blank credentials once.
# Set a name to use an existing Secret instead (see README for required keys).
existingSecret: ""
secrets:
  bootstrapAdminPassword: ""
  # Additional secret environment variables, e.g. backend tokens or OIDC secrets.
  env: {}

# Bundled PostgreSQL is ready to use; requires a default StorageClass.
postgresql:
  enabled: true
  image: postgres:17@sha256:846a7ddaa67a4b354ae1d21087b683901aa6113a4ed626d3787cfbf6c85e3e07
  username: olr
  database: olr
  password: ""
  persistence:
    enabled: true
    size: 8Gi
    storageClass: ""
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {memory: 512Mi}
# Used only when postgresql.enabled=false and existingSecret is empty.
externalDatabase:
  url: ""

# Development SSO, including an imported realm, portal client and staff user.
# Keep baseURL stable after initialization; realm import does not update a realm.
keycloak:
  enabled: true
  image: quay.io/keycloak/keycloak:26.8.2@sha256:c68e286cacd87b942ac1939a0a1481461109d6acd3a57dc496969a319a76bbf0
  baseURL: http://localhost:8081
  # Browser-visible route; baseURL must match its scheme and host.
  ingress:
    enabled: false
    className: ""
    host: ""
    annotations: {}
    tlsSecretName: ""
  adminPassword: ""
  clientSecret: ""
  demoUserPassword: ""
  persistence:
    enabled: true
    size: 1Gi
    storageClass: ""
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {memory: 1Gi}

# Deterministic OpenAI-compatible replies; no GPU or downloaded models required.
demoBackend:
  enabled: true
  image:
    repository: olr-mock-llm
    digest: ""
    tag: local
    pullPolicy: IfNotPresent
  resources:
    requests: {cpu: 50m, memory: 32Mi}
    limits: {memory: 128Mi}

# Defaults support localhost port-forwarding. Use an HTTPS origin and true for
# cookieSecure when publishing the portal.
portal:
  baseURL: http://localhost:8080
  cookieSecure: false

# Non-secret environment variables, e.g. OIDC_ISSUER, OIDC_PORTAL_CLIENT_ID,
# OIDC_GROUPS_CLAIM, OLR_BACKEND_ALLOWED_CIDRS, OLR_BACKEND_TOKEN_ENVS, OTEL_*.
# OLR_CONFIG, PORTAL_* and bundled service connection variables are managed by
# the chart. Disable bundled Keycloak to supply external OIDC_* values.
env: {}

# The same router YAML as config.example.yaml. ${ENV_VAR} references are passed
# unchanged to the router. Put credentials in secrets.env or existingSecret.
# A demo model is added only when demoBackend.enabled=true. Disable it for an
# empty initial catalog or supply real models here; no demo environment is needed.
config:
  security:
    require_tls: false
  content_tracing:
    enabled: false
    redact_patterns: []
  auth:
    default_key_lifetime_days: 90
    max_key_lifetime_days: 90
    max_active_keys_per_user: 10
  limits:
    timezone: UTC
    max_body_bytes: 4194304
    max_body_readers: 32
    max_body_readers_per_user: 4
  models:
    chat-model:
      upstream_model: chat-model
      protocols: [openai]
      timeout_s: 900
      idle_timeout_s: 120
      queue_timeout_s: 120
      session_affinity: true
      # Empty: use the bundled demo only when enabled; otherwise omit this
      # placeholder. Set a complete pool list to use a real backend.
      pool: []
  groups:
    staff:
      models: ["*"]
      tokens_per_day: 2000000
      tokens_per_month: 20000000
      rpm: 60
      max_concurrent: 4
    admins:
      models: ["*"]
      admin: true

service:
  type: ClusterIP
  port: 80
  annotations: {}

# Controller-specific streaming settings belong in annotations. See the chart
# README for Traefik and NGINX examples and TLS setup.
ingress:
  enabled: false
  className: ""
  host: ""
  annotations: {}
  tlsSecretName: ""

resources:
  requests:
    cpu: 500m
    memory: 256Mi
  limits:
    memory: 1Gi
podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}

# Enforced by a NetworkPolicy-capable CNI. External endpoints need explicit peers.
networkPolicy:
  enabled: true
  # Select your controller's actual namespace AND pod labels. No controller is
  # assumed. Required when exposing either router or Keycloak through ingress.
  ingressPeers: []
  monitoringPeers:
    - namespaceSelector:
        matchLabels: {kubernetes.io/metadata.name: monitoring}
      podSelector:
        matchLabels: {app.kubernetes.io/name: prometheus}
  # Complete Kubernetes egress rules (to + ports); never use unrestricted peers.
  egress: []
# Optional Secret with CA certificates, e.g. sslrootcert=/etc/olr/ca/ca.crt.
tls:
  caSecretName: ""
