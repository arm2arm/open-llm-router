production: true
# Optional chart-level policy; true requires digests for every enabled image.
enforceImageDigests: false
# Copy to a private site values file. Replace the image, host, issuer, model and
# backend origin. Credentials belong in the separately created olr-secrets Secret.
image:
  repository: registry.example.org/olr
  tag: REPLACE_WITH_TESTED_GIT_SHA
  digest: "" # Optional: sha256:<verified 64-hex digest>; overrides tag.
# Use your existing managed database, model servers and production Keycloak.
postgresql:
  enabled: false
keycloak:
  enabled: false
demoBackend:
  enabled: false
existingSecret: olr-secrets
portal:
  baseURL: https://llm.example.org
  cookieSecure: true
env:
  # OLR_DATABASE_URL in olr-secrets must use sslmode=verify-full.
  OLR_BACKEND_ALLOWED_CIDRS: 192.168.1.0/24
  # Optional external Keycloak; remove these lines for local-only login.
  OIDC_ISSUER: https://login.example.org/realms/example
  OIDC_PORTAL_CLIENT_ID: olr-portal
  OIDC_GROUPS_CLAIM: groups
  OIDC_USERNAME_CLAIM: preferred_username
  # OIDC_AUDIENCE: olr-api
  # OIDC_SYNC_CLIENT_ID: olr-sync
config:
  security: {require_tls: true}
  models:
    chat-model:
      upstream_model: replace-with-installed-model
      # Enable anthropic only if the backend implements its native API too.
      protocols: [openai]
      pool:
        - url: https://inference.example.org
          health_path: /
          weight: 1
          max_inflight: 1
  # Group names must match the Keycloak groups claim or local memberships.
  groups:
    staff:
      models: [chat-model]
      tokens_per_day: 2000000
      tokens_per_month: 20000000
      rpm: 60
      max_concurrent: 4
    admins:
      models: ["*"]
      admin: true

# This example targets F5 NGINX Ingress Controller (NGINX Open Source).
# Merge deploy/nginx/f5-controller-config.yaml into the controller ConfigMap
# for connection limits and upload timeout. Other controllers need equivalents.
ingress:
  enabled: true
  className: nginx
  host: llm.example.org
  tlsSecretName: olr-tls
  annotations:
    nginx.org/proxy-buffering: "False"
    nginx.org/proxy-read-timeout: "960s"
    nginx.org/proxy-send-timeout: "960s"
    nginx.org/client-max-body-size: "4m"
    nginx.org/limit-req-rate: "10r/s"
    nginx.org/limit-req-key: "${binary_remote_addr}"
    nginx.org/limit-req-burst: "20"
    nginx.org/limit-req-no-delay: "true"
    nginx.org/limit-req-reject-code: "429"

# Replace documentation IPs with resolved site endpoints; use pod+namespace
# selectors for in-cluster services. Include every approved destination only.
networkPolicy:
  enabled: true
  # Match the namespace and labels of your installed F5 controller.
  ingressPeers:
    - namespaceSelector:
        matchLabels: {kubernetes.io/metadata.name: nginx-ingress}
      podSelector:
        matchLabels: {app.kubernetes.io/name: nginx-ingress}
  egress:
    - to: [{ipBlock: {cidr: 192.0.2.10/32}}] # PostgreSQL
      ports: [{protocol: TCP, port: 5432}]
    - to: [{ipBlock: {cidr: 192.0.2.20/32}}] # Identity provider
      ports: [{protocol: TCP, port: 443}]
    - to: [{ipBlock: {cidr: 192.0.2.30/32}}] # Inference
      ports: [{protocol: TCP, port: 443}]
    - to: [{ipBlock: {cidr: 192.0.2.40/32}}] # Optional telemetry
      ports: [{protocol: TCP, port: 4318}]
