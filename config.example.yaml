# open-llm-router example configuration. It is the config of the local Compose
# stack and points at the two mock backends.
#
# - ${NAME} is replaced by the environment variable NAME; start-up fails if it
#   is not set. Inside {...} or [...] put the reference in quotes: "${NAME}".
# - Unknown keys are errors. Settings from docs/PLAN.md §9 that are not built
#   yet (forwarders, priority, required_claim, ...) are refused until they are.
# - Secrets are not set here. They are read from the environment only:
#   OLR_DATABASE_URL and OIDC_PORTAL_CLIENT_SECRET.

# Portal login. Leave the section out to run without a portal (API keys only).
oidc:
  issuer: ${OIDC_ISSUER}            # dev: http://keycloak:8080/realms/olr-dev
  portal_client_id: olr-portal
  groups_claim: groups              # default
  username_claim: preferred_username # default

models:
  chat-model:
    protocols: [openai, anthropic]
    timeout_s: 900
    idle_timeout_s: 30             # max silence between response chunks
    # upstream_model: backend-served-name  # optional, also applied to aliases
    pool:
      # weight is the relative throughput of a replica; max_inflight caps the
      # requests it serves at once.
      - {url: http://mock-llm-a:8000, weight: 2.0, max_inflight: 64}
      - {url: http://mock-llm-b:8000, weight: 1.0, max_inflight: 32}
      # For a vLLM --api-key backend, add bearer_token_env: VLLM_API_KEY
      # to its replica and export that variable in the router's environment.

# Policy per identity-provider group. A limit that is left out is not enforced.
groups:
  staff:    {models: ["*"], tokens_per_day: 2000000, rpm: 60, max_concurrent: 4}
  students: {models: [chat-model], tokens_per_day: 300000, rpm: 20, max_concurrent: 2}
  admins:   {models: ["*"]}

# Names that clients send by default, mapped to a model above.
aliases: {claude-sonnet-4-5: chat-model}
