# Compose 2.24.4+: merge directly with docker-compose.yml in this directory.
# Example: docker compose -f deploy/compose/docker-compose.yml \
#   -f deploy/compose/local-only.yml up --build --detach --wait
services:
  router:
    # Remove inherited values entirely so managed SSO secrets can be added later.
    environment:
      OIDC_ISSUER: !reset null
      OIDC_PORTAL_CLIENT_ID: !reset null
      OIDC_PORTAL_CLIENT_SECRET: !reset null
      OIDC_SYNC_CLIENT_ID: !reset null
      OIDC_SYNC_CLIENT_SECRET: !reset null
      OIDC_BACKCHANNEL_URL: !reset null
      OIDC_AUDIENCE: !reset null
      OIDC_GROUPS_CLAIM: !reset null
      OIDC_USERNAME_CLAIM: !reset null
      OIDC_REQUIRED_CLAIM: !reset null
    depends_on: !override
      postgres:
        condition: service_healthy
      mock-llm-a:
        condition: service_started
      mock-llm-b:
        condition: service_started
    volumes: !override
      - ${OLR_LOCAL_CONFIG_FILE:-../../config.local.example.yaml}:/etc/olr/config.yaml:ro
  keycloak:
    profiles: [sso]
