# Local development stack. All published ports are restricted to loopback.
# The router forwards both protocols to these replicas and handles portal login.
name: olr

services:
  router:
    build:
      context: ../..
      target: olr
    ports:
      - "127.0.0.1:${OLR_PORT:-8080}:8080"
    environment:
      OLR_DATABASE_URL: ${OLR_DATABASE_URL:-postgres://olr:olr-dev-only@postgres:5432/olr?sslmode=disable}
      OLR_API_KEY_ENCRYPTION_KEY: ${OLR_API_KEY_ENCRYPTION_KEY:-}
      OLR_SETTINGS_ENCRYPTION_KEY: ${OLR_SETTINGS_ENCRYPTION_KEY:-}
      OLR_BOOTSTRAP_ADMIN_PASSWORD: ${OLR_BOOTSTRAP_ADMIN_PASSWORD:-}
      OLR_BOOTSTRAP_ADMIN_PASSWORD_FILE: ${OLR_BOOTSTRAP_ADMIN_PASSWORD_FILE:-}
      OIDC_ISSUER: ${OIDC_ISSUER:-http://localhost:${KEYCLOAK_PORT:-8081}/realms/olr-dev}
      OIDC_PORTAL_CLIENT_ID: ${OIDC_PORTAL_CLIENT_ID:-olr-portal}
      OIDC_PORTAL_CLIENT_SECRET: ${OIDC_PORTAL_CLIENT_SECRET:-olr-portal-dev-only}
      OIDC_GROUPS_CLAIM: ${OIDC_GROUPS_CLAIM:-groups}
      OIDC_USERNAME_CLAIM: ${OIDC_USERNAME_CLAIM:-preferred_username}
      OIDC_BACKCHANNEL_URL: ${OIDC_BACKCHANNEL_URL-http://keycloak:8080/realms/olr-dev}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE-olr-api}
      OIDC_SYNC_CLIENT_ID: ${OIDC_SYNC_CLIENT_ID:-olr-sync}
      OIDC_SYNC_CLIENT_SECRET: ${OIDC_SYNC_CLIENT_SECRET-olr-sync-dev-only}
      # Defence in depth on top of Keycloak's mappers; empty to switch off.
      OIDC_REQUIRED_CLAIM: ${OIDC_REQUIRED_CLAIM-affiliation=member@example.org}
      PORTAL_BASE_URL: ${PORTAL_BASE_URL:-http://localhost:${OLR_PORT:-8080}}
      PORTAL_COOKIE_SECURE: ${PORTAL_COOKIE_SECURE:-false}
      OLR_METRICS_TOKEN: ${OLR_METRICS_TOKEN:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_EXPORTER_OTLP_TRACES_HEADERS: ${OTEL_EXPORTER_OTLP_TRACES_HEADERS:-}
      OLR_TRACE_USER_ID: ${OLR_TRACE_USER_ID:-false}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3.8:27b-mlx}
      # Admin-added private backends; initial YAML destinations stay trusted.
      OLR_BACKEND_ALLOWED_CIDRS: ${OLR_BACKEND_ALLOWED_CIDRS:-192.168.0.0/16}
      OLR_BACKEND_TOKEN_ENVS: ${OLR_BACKEND_TOKEN_ENVS:-}
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      mock-llm-a:
        condition: service_started
      mock-llm-b:
        condition: service_started
    volumes:
      - ${OLR_CONFIG_FILE:-../../config.example.yaml}:/etc/olr/config.yaml:ro
    # A little longer than the router's own shutdown grace of 30 s.
    stop_grace_period: 35s

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-keycloak-admin-dev-only}
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8081}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
      PORTAL_BASE_URL: ${PORTAL_BASE_URL:-http://localhost:${OLR_PORT:-8080}}
      KEYCLOAK_PORT: ${KEYCLOAK_PORT:-8081}
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-8081}:8080"
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ../keycloak/olr-dev-realm.json:/opt/keycloak/data/import/olr-dev-realm.json:ro
      - ../keycloak/upstream-idp-realm.json:/opt/keycloak/data/import/upstream-idp-realm.json:ro
    healthcheck:
      test: ["CMD", "bash", "-ec", "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'HEAD /health/ready HTTP/1.0\\r\\n\\r\\n' >&3; read -r line <&3; [[ $$line == *' 200 '* ]]"]
      interval: 2s
      timeout: 3s
      retries: 45
      start_period: 15s

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-olr}
      POSTGRES_DB: ${POSTGRES_DB:-olr}
      # Public, local-development credentials; never use these for a deployment.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-olr-dev-only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s

  mock-llm-a:
    build:
      context: ../..
      target: mock-llm
    environment:
      MOCK_MODELS: chat-model
      MOCK_TOKENS: ${MOCK_TOKENS:-16}
      MOCK_TOKEN_DELAY: ${MOCK_A_TOKEN_DELAY:-20ms}
    ports:
      - "127.0.0.1:${MOCK_A_PORT:-8001}:8000"

  mock-llm-b:
    build:
      context: ../..
      target: mock-llm
    environment:
      MOCK_MODELS: chat-model
      MOCK_TOKENS: ${MOCK_TOKENS:-16}
      MOCK_TOKEN_DELAY: ${MOCK_B_TOKEN_DELAY:-40ms}
    ports:
      - "127.0.0.1:${MOCK_B_PORT:-8002}:8000"

volumes:
  postgres-data:
  keycloak-data:
