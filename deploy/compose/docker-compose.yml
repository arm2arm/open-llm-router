# Local development stack. All published ports are restricted to loopback.
# Keycloak is added in #14. The router forwards both protocols to these replicas.
name: olr

services:
  router:
    build:
      context: ../..
      target: olr
    ports:
      - "127.0.0.1:${OLR_PORT:-8080}:8080"
    environment:
      OLR_DATABASE_URL: ${OLR_DATABASE_URL:-postgres://olr:olr-dev-only@postgres:5432/olr?sslmode=disable}
      # Read by config.example.yaml; no OIDC calls until authentication is built.
      OIDC_ISSUER: ${OIDC_ISSUER:-http://keycloak:8080/realms/olr-dev}
      OIDC_PORTAL_CLIENT_SECRET: ${OIDC_PORTAL_CLIENT_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
      mock-llm-a:
        condition: service_started
      mock-llm-b:
        condition: service_started
    volumes:
      - ../../config.example.yaml:/etc/olr/config.yaml:ro
    # A little longer than the router's own shutdown grace of 30 s.
    stop_grace_period: 35s

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-olr}
      POSTGRES_DB: ${POSTGRES_DB:-olr}
      # Public, local-development credentials; never use these for a deployment.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-olr-dev-only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s

  mock-llm-a:
    build:
      context: ../..
      target: mock-llm
    environment:
      MOCK_MODELS: chat-model
      MOCK_TOKENS: ${MOCK_TOKENS:-16}
      MOCK_TOKEN_DELAY: ${MOCK_A_TOKEN_DELAY:-20ms}
    ports:
      - "127.0.0.1:${MOCK_A_PORT:-8001}:8000"

  mock-llm-b:
    build:
      context: ../..
      target: mock-llm
    environment:
      MOCK_MODELS: chat-model
      MOCK_TOKENS: ${MOCK_TOKENS:-16}
      MOCK_TOKEN_DELAY: ${MOCK_B_TOKEN_DELAY:-40ms}
    ports:
      - "127.0.0.1:${MOCK_B_PORT:-8002}:8000"

volumes:
  postgres-data:
