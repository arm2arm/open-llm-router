apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: router
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/component: router}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: ingress-nginx}
          podSelector:
            matchLabels: {app.kubernetes.io/component: controller}
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: monitoring}
          podSelector:
            matchLabels: {app.kubernetes.io/name: prometheus}
      ports: [{protocol: TCP, port: 8080}]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
    # Documentation addresses: replace with site IPs, ports or namespace+pod selectors.
    - to: [{ipBlock: {cidr: 192.0.2.10/32}}] # PostgreSQL with verify-full
      ports: [{protocol: TCP, port: 5432}]
    - to: [{ipBlock: {cidr: 192.0.2.20/32}}] # IdP
      ports: [{protocol: TCP, port: 443}]
    - to: [{ipBlock: {cidr: 192.0.2.30/32}}] # Inference
      ports: [{protocol: TCP, port: 443}]
    - to: [{ipBlock: {cidr: 192.0.2.40/32}}] # OTLP over HTTPS
      ports: [{protocol: TCP, port: 4318}]
