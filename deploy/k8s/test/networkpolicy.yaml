# Disposable demo dependencies, isolated from other namespace workloads.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: router-demo-egress
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/component: router}
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/component: postgres}
      ports: [{protocol: TCP, port: 5432}]
    - to:
        - podSelector:
            matchExpressions:
              - {key: app.kubernetes.io/component, operator: In, values: [mock-llm-a, mock-llm-b]}
      ports: [{protocol: TCP, port: 8000}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: demo-dependencies
spec:
  podSelector:
    matchExpressions:
      - {key: app.kubernetes.io/component, operator: In, values: [postgres, mock-llm-a, mock-llm-b]}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/component: router}
      ports: [{protocol: TCP, port: 5432}, {protocol: TCP, port: 8000}]
  egress: []
