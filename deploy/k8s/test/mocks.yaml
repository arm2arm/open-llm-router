apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-llm-a
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/component: mock-llm-a}
  template:
    metadata:
      labels: {app.kubernetes.io/component: mock-llm-a}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: mock
          image: mock-llm
          env:
            - {name: MOCK_MODELS, value: chat-model}
            - {name: MOCK_TOKENS, value: "16"}
            - {name: MOCK_TOKEN_DELAY, value: 20ms}
          ports:
            - {containerPort: 8000}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
metadata:
  name: mock-llm-a
spec:
  selector: {app.kubernetes.io/component: mock-llm-a}
  ports:
    - {port: 8000}
---
