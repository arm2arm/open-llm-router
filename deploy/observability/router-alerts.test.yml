rule_files: [router-alerts.yml]
evaluation_interval: 1m
tests:
  - name: Database outage is visible while metrics still respond
    interval: 1m
    input_series:
      - series: up{job="olr",instance="fixture"}
        values: 1+0x5
      - series: olr_database_reachable{job="olr",instance="fixture"}
        values: 0+0x5
    promql_expr_test:
      - expr: ALERTS{alertname="OLRDatabaseUnavailable",alertstate="firing"}
        eval_time: 2m
        exp_samples:
          - labels: ALERTS{alertname="OLRDatabaseUnavailable",alertstate="firing",job="olr",instance="fixture",severity="critical"}
            value: 1
      - expr: ALERTS{alertname="OLRUnavailable",alertstate="firing"}
        eval_time: 2m
        exp_samples: []
  - name: Accounting failures alert without an HTTP outage
    interval: 1m
    input_series:
      - series: olr_usage_dropped_total{job="olr",instance="fixture"}
        values: 0 0 1 1 1 1
    promql_expr_test:
      - expr: ALERTS{alertname="OLRAccountingLoss",alertstate="firing"}
        eval_time: 3m
        exp_samples:
          - labels: ALERTS{alertname="OLRAccountingLoss",alertstate="firing",job="olr",instance="fixture",severity="critical"}
            value: 1
